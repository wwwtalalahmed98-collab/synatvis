blocked_on: "Actual DNA sequence text for every part above. Crozet et al. 2018 (the primary paper) is paywalled at ACS Publications with no PMC deposit (confirmed via PubMed metadata: no 'pmc' field for PMID 30165733) and no downloadable sequence file found on the catalog pages themselves (checked raw HTML directly, not just a page summary). de Carpentier et al. 2020 is open access (PMC7066984) but its plain full text does not contain the complete domesticated BSR coding sequence -- only short 20-nt primer fragments were found by scanning for DNA-letter runs; the full construct sequence is likely in a supplementary table/figure image, which is not machine-readable through the tools used here."

next_options:
  - "Request the paywalled Crozet 2018 Supporting Information through institutional/journal access (fastest, if available)."
  - "Order the physical plasmid stock from the Chlamydomonas Resource Center and have it sequenced -- expensive and slow, but the most authoritative route; overlaps with the Step 11 licensing/MTA audit."
  - "Check each paper's supplementary figures/tables (image-based) manually for embedded sequence text, since these are not retrievable through the text-only tools used in this pass."
  - "Contact the original scientists directly and ask for the deposited sequence files -- chosen by the user on 2026-08-07 as the first thing to try."

