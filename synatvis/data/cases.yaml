# SynAT.Vis Leg-3 corpus - REAL literature rescue pairs (authentic sequences).
#
# Each case: {id, organism, compartment, lineage, module, expect_flag, mechanism,
# citation, sequence}. Sequences are real (NCBI accessions given) except the
# codon-optimized GFP partner, which is produced by the DOCUMENTED method
# (optimizing the real native GFP protein to the authentic Kazusa Cr codon table),
# reproducing the classic Cr codon-optimization rescue. expect_flag reflects the
# LITERATURE expectation (ground truth); Leg-3 measures whether the tool agrees.
# The chloroplast case is GATED OUT of nuclear scoring (compartment gating demo).
cases:
  - id: gfp_native_at_rich
    organism: Aequorea victoria (expressed in C. reinhardtii)
    compartment: nuclear
    lineage: chlorophyte
    module: composition
    expect_flag: true
    mechanism: "native AT-rich GFP (GC 38%) is poorly expressed / silenced in Cr nuclear genome; low GC is the hazard"
    citation: "Fuhrmann et al. 1999 Plant J; Barahimipour et al. 2015 Plant J (PMID 26402748); native seq NCBI MN114103.1"
    sequence: ""

  - id: gfp_cr_codon_optimized
    organism: Aequorea victoria GFP, Cr-codon-optimized
    compartment: nuclear
    lineage: chlorophyte
    module: composition
    expect_flag: false
    mechanism: "same GFP protein optimized to Cr codons (GC 62%); documented rescue - expression restored (single-variable: only synonymous codons changed)"
    citation: "Method of Fuhrmann 1999 / Barahimipour 2015; optimized to Kazusa Cr table (this build); protein identical to gfp_native_at_rich"
    sequence: ""

  - id: cr_native_with_bsaI
    organism: Chlamydomonas reinhardtii
    compartment: nuclear
    lineage: chlorophyte
    module: cloning
    expect_flag: true
    mechanism: "real native Cr nuclear gene carrying an internal BsaI site; must be domesticated before MoClo/Golden Gate assembly"
    citation: "Crozet et al. 2018 (algal MoClo); native seq NCBI lcl|XM_001700409.2_cds_XP_001700461.1_1"
    sequence: ""

  - id: cr_chloroplast_gene_GATED
    organism: Chlamydomonas reinhardtii (chloroplast)
    compartment: chloroplast
    lineage: chlorophyte
    module: composition
    expect_flag: true
    mechanism: "AT-rich plastid gene (GC 36%); the nuclear low-GC detector must be GATED OUT for a chloroplast construct"
    citation: "Cr plastid genome NCBI NC_005353.1; demonstrates compartment gating (CLAUDE.md §7)"
    sequence: ""

  - id: luc_native_at_rich
    organism: firefly luciferase (Photinus pyralis) (expressed in C. reinhardtii)
    compartment: nuclear
    lineage: chlorophyte
    module: composition
    expect_flag: true
    mechanism: "native AT-rich reporter (GC 45%); poorly expressed in Cr nuclear genome without codon adaptation"
    citation: "Ruecker et al. 2008 (Cr-optimized luciferase expresses where native does not); native seq NCBI MH759210.1"
    sequence: ""

  - id: luc_cr_codon_optimized
    organism: firefly luciferase (Photinus pyralis), Cr-codon-optimized
    compartment: nuclear
    lineage: chlorophyte
    module: composition
    expect_flag: false
    mechanism: "same protein optimized to Cr codons (GC 65%); documented rescue (single-variable: only synonymous codons changed)"
    citation: "optimized to Kazusa Cr table (this build); protein identical to luc_native_at_rich"
    sequence: ""
