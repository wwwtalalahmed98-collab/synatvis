version: 1
purpose: >
  Real, published, QUANTITATIVE Chlamydomonas expression measurements, used to
  move the expression-propensity index from "directionally validated against
  qualitative literature" toward genuinely calibrated. Every anchor must cite a
  real, retrievable source and record real measured numbers -- never an estimate,
  never a number inferred from a figure we could not read.

how_to_use: >
  An anchor constrains ORDERING and, where stated, MAGNITUDE. The expression
  index is bounded 0-100 and is not a fold-change predictor, so it cannot
  reproduce a 16x ratio directly. What it must not do is rank a construct that
  really expresses better as WORSE. Ordering violations are real failures;
  magnitude mismatch is a known, documented limitation.

status: >
  THREE anchor sets across TWO axes. Introns: Frontiers 2025 (NanoLuc) and Baier 2018
  NAR (mVenus), independently corroborating. Codon adaptation: Barahimipour 2015
  Plant J, same protein with synonymous codons only. The tool currently PASSES the
  codon axis and FAILS the intron axis -- a far more useful statement than a single
  overall verdict, and it localises the defect to one mechanism rather than the whole
  index. Still NOT calibrated: these anchors constrain ORDERING, not magnitude, and
  only two of the four weighted models (rca, tai, gc, dg) are anchored at all.
  Describe the index as "directionally validated; ordering confirmed on the codon axis,
  one open defect on the intron axis" -- never "calibrated".

anchors:
  - id: intron_mediated_enhancement_nanoluc
    organism: Chlamydomonas reinhardtii
    compartment: nuclear
    reporter: NanoLuc (fused to mVenus)
    assembly: MoClo Level-2 device
    introns_tested: [RBCS2i1, RBCS2i2]
    method: >
      NanoLuc activity measured in relative light units from pools of more than
      1000 individual transformants per construct, reducing position-effect noise;
      confirmed at protein level (in-gel detection) and transcript level (mRNA).
    citation: "Frontiers in Plant Science 2025, PMC11925875 -- 'A novel MoClo-mediated intron insertion system facilitates enhanced transgene expression in Chlamydomonas reinhardtii'"
    open_access: true
    retrieved: "2026-08-12 via Europe PMC fullTextXML"
    measurements:
      - construct: intron-less control
        introns: 0
        relative_protein_activity: 1.0
        note: "baseline"
      - construct: "+RBCS2i2 downstream"
        introns: 1
        relative_protein_activity: 6.0
        note: "approximately 6-fold, as stated in the text"
      - construct: "+RBCS2i1 upstream"
        introns: 1
        relative_protein_activity: 9.0
        note: "9-fold enhancement, as stated in the text"
      - construct: "both introns"
        introns: 2
        relative_protein_activity: 16.0
        note: "text says 'more than 16-fold'; 16.0 recorded as a documented LOWER BOUND, not an exact value"
    transcript_level:
      both_introns_fold: 60
      single_intron_fold_range: [2, 8]
      note: "transcript abundance in pools of the strongest clones; single-intron range depends on which intron and which insertion site"
    required_ordering:
      - "score(2 introns) >= score(1 intron)"
      - "score(1 intron) >= score(0 introns)"

  - id: intron_mediated_enhancement_mvenus_baier2018
    organism: Chlamydomonas reinhardtii
    compartment: nuclear
    reporter: mVenus (YFP) fused to a codon-optimised PcPs sequence
    intron: "rbcS2i1, 145 bp, NCBI X04472.1 -- the canonical Cr expression-boosting intron"
    method: >
      Four vectors differing only in intron content: A is intron-less; B and C add rbcS2i1
      stepwise; D is the full intron-containing design with exons of 583 bp or smaller.
      Fluorescence measured at protein level, relative mRNA abundance at transcript level.
    citation: "Baier et al. 2018, Nucleic Acids Research, PMC6061784 -- 'Intron-containing algal transgenes mediate efficient recombinant gene expression in the green microalga Chlamydomonas reinhardtii'"
    open_access: true
    retrieved: "2026-08-13 via Europe PMC fullTextXML"
    measurements:
      - construct: "vector A -- intron-less"
        introns: 0
        relative_protein_activity: 1.0
        note: "baseline"
      - construct: "vectors B and C -- stepwise rbcS2i1 incorporation"
        introns: 1
        relative_protein_activity: null
        note: "text states expression was 'consistently increased' with stepwise incorporation but gives no separate number for B and C; recorded as ordering evidence only, NOT as a magnitude"
      - construct: "vector D -- full intron-containing design"
        introns: 2
        relative_protein_activity: 8.0
        note: "8-fold greater fluorescence than intron-less vector A"
    transcript_level:
      vector_d_vs_a_fold: 100
      note: "text says '>100-fold change of relative mRNA abundance comparing vector A and D'; recorded as a documented LOWER BOUND"
    required_ordering:
      - "score(vector D) >= score(vector A)"
    why_this_anchor_matters: >
      An INDEPENDENT corroboration of the first anchor, from a different laboratory, a
      different reporter (mVenus vs NanoLuc) and a different construct design. The two
      agree on direction and on magnitude class: protein enhancement in the single-to-low
      double-digit fold range (8x here, >16x there) and transcript enhancement much larger
      (>100x here, ~60x there). Two independent measurements agreeing this closely is
      considerably stronger evidence than either alone.

  - id: codon_adaptation_yfp_barahimipour2015
    axis: "codon adaptation (RCA) -- the SECOND axis, independent of the intron anchors"
    organism: Chlamydomonas reinhardtii
    compartment: nuclear
    reporter: YFP (Venus derivative)
    method: >
      Four YFP variants encoding the SAME protein, differing only in synonymous codon
      usage, placed in the same expression cassette and the same transformation vector.
      Critically, one variant (YFPla) was built by synonymous NNC->NNG substitution so it
      holds GC content constant while dropping RCA -- this deliberately DECOUPLES codon
      usage from GC content, which no other anchor here does. Protein measured by in-gel
      fluorescence against a calibrated internal standard.
    citation: "Barahimipour et al. 2015, The Plant Journal, PMC4715772 -- 'Dissecting the contributions of GC content and codon usage to gene expression in the model alga Chlamydomonas reinhardtii'"
    open_access: true
    retrieved: "2026-08-13 via NCBI PMC efetch"
    already_cited_in_project: "cases.yaml Leg-3 rescue pair cites this paper"
    measurements:
      - variant: CrYFP
        rca_percent: 100.0
        gc_percent: 66
        outcome: "by far the highest YFP expression; accumulates to >1% of total soluble protein"
        rank: 4
      - variant: vYFP
        rca_percent: 93.9
        gc_percent: 62
        outcome: "significantly higher accumulation than YFPla despite slightly LOWER GC -- attributed to higher RCA"
        rank: 3
      - variant: YFPla
        rca_percent: 71.9
        gc_percent: 63
        outcome: "much lower accumulation than CrYFP at identical GC content"
        rank: 2
      - variant: CrCpYFP
        rca_percent: 16.5
        gc_percent: 28
        outcome: "below the detection limit -- no appreciable expression even in UVM expression strains"
        rank: 1
    required_ordering:
      - "score(CrYFP) >= score(vYFP) >= score(YFPla) >= score(CrCpYFP)"
      - "monotonic in RCA"
    why_this_anchor_matters: >
      This is the second AXIS the calibration leg needed. Both intron anchors probe the same
      mechanism; this one probes codon adaptation, which is the single heaviest-weighted
      model in the expression index. The vYFP-versus-YFPla comparison is the sharpest result
      in the paper: vYFP has slightly LOWER GC but HIGHER RCA and expresses significantly
      better, so RCA dominates GC. The tool weights rca at 0.30 and gc at 0.20, which is
      directionally consistent with that finding -- but the weights were never fitted to it.
    caveat: >
      The paper reports ranks and qualitative magnitudes ("much lower", "below detection")
      plus one absolute figure (>1% TSP), not a clean fold-change table. So this anchor
      constrains ORDERING strictly and magnitude only loosely.

known_defect_exposed:
  id: intron_sequence_scored_as_coding
  found: "2026-08-12"
  observed: >
    Using the real excised bTUB2i1 intron part (pCM0-041, 180 bp, GC 60.6%) inserted
    into the shipped Cr-codon-optimised GFP case, the expression index scored:
    0 introns = 66.8, 1 intron = 69.6, 2 introns = 57.4. The single-intron case moves
    the right way (+2.8) but the two-intron case moves the WRONG way (-9.4), while the
    real measured effect is the largest in this anchor set (>16x more protein).
  mechanism: >
    The expression index computes codon-adaptation metrics (RCA, tAI) across the whole
    submitted sequence. Intron sequence is not coding sequence and is spliced out before
    translation, but it is nonetheless included in those codon statistics, so each added
    intron dilutes the apparent codon adaptation and drags the score down. The scanner's
    splice module DOES correctly detect these introns ("Cr-type intron-like feature:
    donor GTRAG / acceptor YAG"), but the expression index never consumes that detection.
  proposed_fix: >
    Mask splice-module-detected intron spans out of the coding-metric computation, so
    RCA/tAI are computed over exonic sequence only. This is a correctness fix grounded
    in biology (introns are spliced out before translation), NOT a coefficient fitted to
    the paper above -- it introduces no fitted constant.
  status: "documented and reproducible via `synatvis validate calibration`; the fix was IMPLEMENTED, MEASURED, and REJECTED -- see fix_attempt below"

fix_attempt:
  date: "2026-08-13"
  outcome: REJECTED
  what_was_done: >
    The intron-masking fix was fully implemented in expression.py (deliberate-intron
    spans -- splice module, INFO severity, GC >= 0.60 -- removed before computing RCA,
    tAI and folding dG; GC deliberately left on the full sequence because the silencing
    hazard is chromatin acting on integrated genomic DNA). Every validation leg was
    captured before the change so the effect could be measured rather than assumed.
  why_rejected: >
    It made things worse. The zero-intron control collapsed from 66.8 to 3.6, because
    the splice module had detected a spurious "deliberate intron" inside an ordinary
    Cr-codon-optimised GFP that contains no intron at all. Measured across 1,000 real
    native Chlamydomonas coding sequences -- which by definition contain no introns --
    413 of 1,000 (41.3%) carry a false "deliberate intron" INFO flag, and the fix would
    delete a median 8.0% (max 58.2%) of their real coding sequence before scoring them.
    The fix therefore trades one narrow, known ordering defect for a pervasive one
    affecting roughly 4 in 10 of every real gene the tool is asked to score.
  root_cause: >
    The real defect is upstream, in detection rather than in scoring. The splice module's
    Cr-consensus donor GTRAG / acceptor YAG pattern with a GC >= 0.60 filter is not
    specific enough on GC-rich sequence -- and GC-rich sequence is precisely what this
    tool exists to analyse, so the false-positive rate is highest exactly where it
    matters most. As an INFO-severity annotation this is tolerable; as a trigger for
    deleting coding sequence it is not.
  correct_order_of_work: >
    Do NOT re-attempt intron masking until the splice module's deliberate-intron call is
    specific enough to act on (target: single-digit false-positive rate on native genes,
    measured the same way). Candidate routes: require canonical branch-point context,
    require the intron to sit in a plausible position, or cross-check against the real
    intron parts now in the construct-grammar corpus. Only once detection is trustworthy
    does masking become a safe correctness fix.
  lesson: >
    A fix that is biologically correct in principle can still be wrong to ship, because
    it inherits the error rate of whatever detector triggers it. Measuring before adopting
    is what caught this; reasoning alone would have shipped a regression affecting 41% of
    real genes.

detection_work_2026_08_13:
  status: "PARTIALLY RESOLVED -- specificity fixed, a separate detection gap surfaced"
  positive_set: >
    38,788 real annotated Chlamydomonas introns, derived from the gaps between exons in
    CDS join() features of 60 NCBI genomic records. Real annotations, not predictions.
  what_the_data_showed: >
    The old test was `GC >= 0.60` absolute. Chlamydomonas coding sequence averages ~68%
    GC, so essentially every candidate passed -- the filter was not filtering. Measured
    reality is the opposite of the assumption: real Cr introns are AT-RICHER than their
    flanking exons (median -6.3% GC), longer (median 230 nt vs 86 nt for false
    candidates), and carry a polypyrimidine tract before the acceptor (63.6% vs 50.0%).
  new_rule:
    intron_min_len: 100          # real p10 = 127 nt
    intron_max_delta_gc: 3.0     # IS the real p90
    intron_min_polypyrimidine: 50.0   # IS the real p10
  measured_result:
    false_positive_rate_before: "41.3% of 992 real intron-less native genes"
    false_positive_rate_after: "9.1% of the same 992 genes"
    sensitivity_after: "82.8% on 38,788 real annotated introns"
    validation_legs_changed: "none -- all seven byte-for-byte identical; 54/54 tests pass"
  why_no_leg_moved: >
    Leg 1 counts only MEDIUM/HIGH severity false positives. The splice module emits its
    intron call at INFO and its accidental-pair warning at LOW, so it never contributed
    to the published specificity numbers. That is precisely why a 41% false-positive rate
    survived unnoticed until calibration forced a look at the informational layer.

open_defect_real_introns_not_detected:
  found: "2026-08-13"
  severity: "significant -- arguably the most important thing this module should catch"
  observed: >
    A real bTUB2i1 intron part (pCM0-041, excised at real BsaI geometry, 180 bp) inserted
    into a Cr-codon-optimised CDS is NOT reported as a deliberate intron -- neither by the
    new rule NOR by the old one. The old rule appeared to detect it, but inspection of the
    flag showed it was reporting the unrelated 110 bp FALSE candidate from the host CDS
    (intron_len: 110, not 180). It looked correct by coincidence.
  implication: >
    The tool cannot currently recognise the intron parts the Cr MoClo toolkit actually
    ships. This is pre-existing and was neither caused nor fixed by the specificity work;
    it was hidden behind that coincidence. It is ALSO the true blocker for intron masking:
    masking cannot help if detection cannot find the intron the user deliberately inserted.
  next_step: >
    Diagnose why the candidate enumeration misses it -- likely the donor/acceptor pair
    inside the excised part does not match GTRAG/YAG under the current min/max intron
    span and one-intron-per-donor scan. Use the real intron parts now in the
    construct-grammar corpus as the positive test set.
  do_not_claim: >
    Do not describe the intron problem as solved. The accurate summary is: false-positive
    rate cut 4x and characterised; detection of real inserted MoClo intron parts remains
    OPEN.
